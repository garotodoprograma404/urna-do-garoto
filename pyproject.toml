[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urna-do-garoto"
version = "2.0.0"
description = "Uma urna em que a fraude é detectável: voto cifrado, provas de conhecimento zero, chave dividida e verificador."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Garoto do Programa" }]

[project.urls]
Repository = "https://github.com/garotodoprograma404/urna-do-garoto"

[tool.setuptools]
py-modules = ["grupo", "cripto", "guardioes", "urna", "verificador", "eleicao", "ataques"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
# apelidos curtos de módulo (C = cripto, GU = guardioes) e exceções com nome em português (ErroUrna)
ignore = ["N812", "N818"]
